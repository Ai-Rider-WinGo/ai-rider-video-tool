name: build-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact_glob: |
              release/*.dmg
              release/*-mac.zip
          - os: windows-latest
            platform: win
            artifact_glob: |
              release/*-setup-*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build mac package
        if: matrix.platform == 'mac'
        run: npm run build:mac

      - name: Build Windows package
        if: matrix.platform == 'win'
        run: npm run build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-rider-${{ matrix.platform }}-${{ github.ref_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
